<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extract</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: 'Space Mono', monospace;
            background-color: #f4f4f0;
            color: #111;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: #fff;
            border: 4px solid #111;
            border-radius: 20px;
            box-shadow: 10px 10px 0 #111;
            padding: 30px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo {
            width: 50px;
            height: 50px;
            margin: 0 auto 20px auto;
            background: #ffde00;
            border: 3px solid #111;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 4px 4px 0 #111;
        }

        .logo svg { width: 28px; height: 28px; fill: #111; }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 25px;
            letter-spacing: -1px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 16px;
            border: 3px solid #111;
            border-radius: 12px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 700;
            outline: none;
            background: #fafafa;
            transition: all 0.2s;
        }

        input:focus {
            background: #fff;
            box-shadow: 4px 4px 0 #00e5ff;
        }

        button {
            width: 100%;
            padding: 16px;
            background: #111;
            color: #fff;
            border: 3px solid #111;
            border-radius: 12px;
            font-family: inherit;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 4px 4px 0 #ff3333;
            transition: all 0.1s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        button:active {
            transform: translate(4px, 4px);
            box-shadow: 0 0 0 #ff3333;
        }

        button svg { width: 20px; height: 20px; fill: #fff; }

        #status {
            font-size: 13px;
            font-weight: 700;
            min-height: 20px;
            margin-bottom: 15px;
        }

        #downloadBtn {
            display: none;
            width: 100%;
            padding: 16px;
            background: #00ff00;
            color: #111;
            border: 3px solid #111;
            border-radius: 12px;
            font-family: inherit;
            font-size: 16px;
            font-weight: 700;
            text-decoration: none;
            box-shadow: 4px 4px 0 #111;
            transition: all 0.1s;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        #downloadBtn:active {
            transform: translate(4px, 4px);
            box-shadow: 0 0 0 #111;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
            </svg>
        </div>
        
        <h1>EXTRACT HD</h1>

        <div class="input-group">
            <input type="text" id="url" placeholder="Tempel Link Canva...">
        </div>

        <button onclick="bypass()">
            <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
            PROSES
        </button>

        <div id="status"></div>

        <a id="downloadBtn" href="#" target="_blank">
            <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
            DOWNLOAD
        </a>
    </div>

    <script>
        async function bypass() {
            const urlInput = document.getElementById('url');
            const status = document.getElementById('status');
            const dl = document.getElementById('downloadBtn');
            
            const url = urlInput.value.trim();
            if (!url) {
                status.innerText = 'Link kosong!';
                status.style.color = '#ff3333';
                return;
            }

            status.innerText = 'MEMPROSES...';
            status.style.color = '#00e5ff';
            dl.style.display = 'none';

            try {
                const res = await fetch('/api/bypass', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ designUrl: url })
                });
                const data = await res.json();
                
                if (data.success) {
                    status.innerText = 'BERHASIL!';
                    status.style.color = '#00ff00';
                    dl.href = data.downloadUrl;
                    dl.style.display = 'flex';
                    urlInput.value = '';
                } else {
                    status.innerText = 'GAGAL: ' + (data.error || 'Link tidak valid');
                    status.style.color = '#ff3333';
                }
            } catch (e) {
                status.innerText = 'ERROR KONEKSI.';
                status.style.color = '#ff3333';
            }
        }
    </script>
</body>
</html>
